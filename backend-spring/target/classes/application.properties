# ---- Web server ----
# Run on the same port the React frontend already calls (http://localhost:8080)
server.port=8080

# ---- Database connection (same DB/credentials as the original backend) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/placement_db
spring.datasource.username=postgres
spring.datasource.password=postgres123

# ---- JPA / Hibernate ----
# "update" = create the students table if it's missing, otherwise leave it alone.
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Hibernate runs, so you can see what JPA does for you.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
